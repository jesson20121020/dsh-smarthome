# Native build scripts that only arrive with the dev-tree copy of the harness
# meta package. The plugin itself needs none of them, so they stay disabled and
# installs stay deterministic.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false

# Install policy for this tree (dev + CI).
#
# The `@deepseek-ai/dsh-*` packages are supplied by the running harness at
# plugin load time. They are declared as peers so the harness compatibility
# gate can see them, and peer auto-installation has to stay ON here: every
# harness package declares its own intra-harness dependencies as exact-pinned
# peers too, so with pnpm's isolated node_modules something like
# `@deepseek-ai/dsh-agent` cannot resolve `@deepseek-ai/dsh-scope` unless pnpm
# materialised that peer.
autoInstallPeers: true

# Prerelease `-rc.N` builds are consumed within hours of publication, so the
# release-age quarantine must not apply to them.
minimumReleaseAge: 0
